<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YCCE Student ERP (Spoofed Test Portal)</title>
    
    <!-- Bootstrap 5 CDN for Layout & Form Controls -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome & Themify Icons for UI Elements -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/themify-icons@0.1.2/css/themify-icons.css">

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YCCE Student ERP</title>
    
    <!-- Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/themify-icons@0.1.2/css/themify-icons.css">

    <!-- External Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
</head>
<body class="theme-primary student-login">

    <div class="container mb-70" id="divMainContainer">
        <div class="main-content">
            <div class="row justify-content-center pb-40" id="divToggleSliderandLogin">
                <div class="col-lg-5 col-md-6 col-12" id="divloginsigninDiv">
                    
                    <div class="login-card" id="divLoginCard">
                        
                        <!-- Header Title -->
                        <div class="content-top-agile pb-0 pt-20 text-center mb-4" id="divLoginCardHeader">
                            <div>
                                <h2 class="text-primary">Let's Get Started</h2>
                                <p class="text-muted mb-0" style="font-size: 13px;">Sign in to our ERP</p>
                            </div>
                        </div>

                        <div class="p-20 p-xs-10" id="divLoginDivBody">
                            
                            <!-- EXACT COPIED FORM STRUCTURE FROM YCCE ERP -->
                            <form returnurl="" action="/" id="LoginForm" method="post">
                                <input name="__RequestVerificationToken" type="hidden" value="jX_hz4mvJ5lmIkqB9s6VcWNk1zk7yr-5HprdlCgnC84qQx4w3STedDFel9tni8zGog8-jTB-K23qZ_OOVYr-vPQ6bnEVdHN0h1s87hcEziE1">
                                
                                <!-- Username Field -->
                                <div class="form-group mb-3">
                                    <label class="form-label"><span class="text-danger me-1"></span>Username / Email</label>
                                    <div class="input-group mb-15">
                                        <span class="input-group-text bg-transparent"><i class="ti-user"></i></span>
                                        <input autocomplete="off" class="form-control ps-15 bg-transparent" id="txtuserid" maxlength="64" name="USER_LOGIN" placeholder="Enter Username" required="" tabindex="1" type="text" value="">
                                        <b><span class="field-validation-valid" data-valmsg-for="USER_LOGIN" data-valmsg-replace="true"></span></b>
                                    </div>
                                </div>

                                <!-- Password Field -->
                                <div class="form-group mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label class="form-label mb-0">Password/OTP</label>
                                        <a href="/ForgotPassword" class="hover-warning ms-auto text-decoration-none" style="font-size: 12px; color: #6c757d;"><i class="fa fa-lock me-1"></i> Trouble in Login?</a>
                                    </div>
                                    <div class="input-group position-relative mb-1">
                                        <span class="input-group-text bg-transparent"><i class="ti-lock"></i></span>
                                        <input autocomplete="off" class="form-control ps-15 bg-transparent" id="txtpassword" maxlength="64" name="txtpassword" placeholder="Enter Password" required="" tabindex="2" type="password" value="">
                                        <i class="fa fa-eye-slash position-absolute" id="togglePassword" style="top: 12px; right: 15px; z-index: 999; color: #aaa; cursor: pointer;"></i>
                                        <input id="hdnPassword" name="LOGIN_OTP" type="hidden" value="">
                                    </div>
                                    <div id="Password" class="text-danger"><span class="field-validation-valid" data-valmsg-for="LOGIN_OTP" data-valmsg-replace="true"></span></div>

                                    <!-- Hidden System Inputs -->
                                    <input id="JsonIpAddress" name="JsonIpAddress" type="hidden" value="117.99.242.155">
                                    <input data-val="true" data-val-number="The field STUDENT_LOGIN_TYPE must be a number." data-val-required="The STUDENT_LOGIN_TYPE field is required." id="JsonStudentLogInTypeId" name="STUDENT_LOGIN_TYPE" type="hidden" value="">
                                    <input id="CurrentDateId" name="CURRENT_DATE" type="hidden" value="">
                                    <input value="0" data-val="true" data-val-number="The field IS_LOAD_TESTING must be a number." data-val-required="The IS_LOAD_TESTING field is required." id="TypeId" name="IS_LOAD_TESTING" type="hidden">

                                    <span class="password-length-check field-validation-error"></span>
                                    <div class="invalid-feedback">Please Enter Password</div>
                                </div>

                                <!-- Cloudflare Turnstile Mock Visual -->
                                <div class="form-group mb-3" id="captchaDiv">
                                    <div class="mock-cloudflare">
                                        <div class="cf-success-text">
                                            <i class="fa fa-check-circle" style="font-size: 18px;"></i>
                                            <span>Success!</span>
                                        </div>
                                        <div style="text-align: right; line-height: 1;">
                                            <strong style="font-size: 10px; color: #f38020; letter-spacing: 0.5px;">CLOUDFLARE</strong><br>
                                            <span style="font-size: 8px; color: #888;">Privacy - Terms</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="row mt-3">
                                    <div class="col-12 text-center">
                                        <button type="button" id="btnSignIn" class="btn btn-info w-100 mt-15">SIGN IN</button>
                                        <input type="hidden" id="hdnTempDataId">
                                        <input type="hidden" id="hdnAccessTempData">
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="ft-bar py-20 mb-0 bg-white">
        <div class="container text-center">
            <a href="https://www.iitms.co.in/" target="_blank"><i class="fa fa-copyright me-1"></i>MasterSoft ERP Solutions Pvt. Ltd.</a>
        </div>
    </div>

</body>
</html>
