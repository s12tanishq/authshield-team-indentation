<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AuthShield Status</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div id="popup-container">
    <div id="popup-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <h1 id="popup-title">AuthShield</h1>
    </div>

    <div id="status-badge" class="status-unknown">
      <span id="status-icon"></span>
      <span id="status-text">UNKNOWN</span>
    </div>

    <p id="status-message">No verification data yet for this tab.</p>

    <div class="info-row">
      <span class="info-label">Domain</span>
      <span id="domain-value" class="domain-chip">—</span>
    </div>

    <div class="info-row">
      <span class="info-label">Checked</span>
      <span id="checked-value">—</span>
    </div>

    <button id="refresh-button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Re-check this page
    </button>

  </div>

  <script src="popup.js"></script>
</body>
